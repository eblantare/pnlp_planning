<div class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <!-- ✅ LOGO PNLP -->
            <img src="assets/logo_pnlp.png"
                 alt="Logo PNLP"
                 class="app-logo"
                 onerror="this.style.display='none'">
            <h1>PNLP Planning</h1>
            <p class="login-subtitle">Programme National de Lutte contre le Paludisme</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="login-form">
            <h2>Connexion</h2>

            <div *ngIf="errorMessage" class="login-error">
                <i class="pi pi-exclamation-triangle"></i>
                {{ errorMessage }}
            </div>

            <div class="form-group">
                <label for="username">
                    <i class="pi pi-user"></i> Nom d'utilisateur
                </label>
                <input type="text"
                       id="username"
                       [(ngModel)]="username"
                       name="username"
                       placeholder="Entrez votre nom d'utilisateur"
                       autocomplete="username"
                       [disabled]="isLoading">
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="pi pi-lock"></i> Mot de passe
                </label>
                <div class="password-input">
                    <input [type]="showPassword ? 'text' : 'password'"
                           id="password"
                           [(ngModel)]="password"
                           name="password"
                           placeholder="Entrez votre mot de passe"
                           autocomplete="current-password"
                           [disabled]="isLoading">
                    <button type="button"
                            class="toggle-password"
                            (click)="togglePassword()"
                            tabindex="-1">
                        <i class="pi" [ngClass]="showPassword ? 'pi-eye-slash' : 'pi-eye'"></i>
                    </button>
                </div>
            </div>

            <!-- ✅ LIEN MOT DE PASSE OUBLIÉ -->
            <div class="forgot-password-link">
                <a routerLink="/forgot-password">Mot de passe oublié ?</a>
            </div>

            <button type="submit"
                    class="login-button"
                    [disabled]="isLoading">
                <i class="pi" [ngClass]="isLoading ? 'pi-spin pi-spinner' : 'pi-sign-in'"></i>
                {{ isLoading ? 'Connexion en cours...' : 'Se connecter' }}
            </button>
        </form>

        <div class="login-footer">
            <p>© {{ currentYear }} PNLP - Tous droits réservés</p>
        </div>
    </div>
</div>
