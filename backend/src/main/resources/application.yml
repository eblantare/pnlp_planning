  spring:
    application:
      name: pnlp-planning

    # Profil local par défaut.
    # Sur Render, nous définirons SPRING_PROFILES_ACTIVE=prod.
    profiles:
      active: ${SPRING_PROFILES_ACTIVE:local}

    datasource:
      # En local : PostgreSQL sur localhost.
      # Sur Render : les variables d'environnement Render prennent le dessus.
      url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pnlp_planning}
      username: ${SPRING_DATASOURCE_USERNAME:postgres}
      password: ${SPRING_DATASOURCE_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver

      hikari:
        maximum-pool-size: 10
        minimum-idle: 5
        idle-timeout: 300000
        connection-timeout: 20000
        max-lifetime: 1200000

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: false
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect
          jdbc:
            batch_size: 20
          order_inserts: true
          order_updates: true

    liquibase:
      change-log: classpath:db/changelog/db.changelog-master.xml
      enabled: true

    # Configuration upload de fichiers
    servlet:
      multipart:
        enabled: true
        max-file-size: 20MB
        max-request-size: 25MB

    mail:
      host: smtp.gmail.com
      port: 587
      username: ${MAIL_USERNAME:dev@example.com}
      password: ${MAIL_PASSWORD:dev-password}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true
              required: true

    jackson:
      serialization:
        write-dates-as-timestamps: false
      time-zone: Africa/Lome

  server:
    port: ${PORT:8080}          # ← Render injecte PORT (ex: 10000)
    servlet:
      context-path: /api

  app:
    jwt:
      secret: ${JWT_SECRET:dev-secret-key-pnlp-2026-changez-en-prod-32chars-min}
      expiration-ms: 86400000

    frontend-url: ${FRONTEND_URL:http://localhost:4200}

    # Dossier de stockage des fichiers uploadés
    upload:
      dir: ${UPLOAD_DIR:uploads}

    password-reset:
      token-expiration-minutes: 30

  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html
      operations-sorter: method
      tags-sorter: alpha

  logging:
    level:
      tg.pnlp.planning: DEBUG
      org.springframework.security: INFO
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
      file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file:

