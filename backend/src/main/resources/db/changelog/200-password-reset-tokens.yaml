databaseChangeLog:
  - changeSet:
      id: 200-create-password-reset-tokens
      author: pnlp
      comment: "Table pour les tokens de réinitialisation de mot de passe"
      changes:
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: utilisateur_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: used
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: password_reset_tokens
            baseColumnNames: utilisateur_id
            referencedTableName: utilisateurs
            referencedColumnNames: id
            constraintName: fk_password_reset_utilisateur
            onDelete: CASCADE