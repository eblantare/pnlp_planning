# ============================================================
# ✅ CONFIGURATION PRODUCTION — Render + Mailjet API HTTP 443
# ============================================================
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 10
        cache:
          use_second_level_cache: false
          use_query_cache: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  # ❌ PAS de spring.mail en prod : Render Free bloque les ports SMTP.
  #    MailjetApiService prend le relais (HTTP 443).

# ============================================================
# ✅ MAILJET API (HTTP sur port 443) — UTILISÉ EN PRODUCTION
# ============================================================
mailjet:
  api-key: ${MAILJET_API_KEY}
  secret-key: ${MAILJET_SECRET_KEY}
  from-email: romain.blantare@gmail.com
  from-name: PNLP Planning

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  frontend-url: ${FRONTEND_URL:https://pnlp-planning-frontend.onrender.com}
  password-reset:
    token-expiration-minutes: 30

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

logging:
  level:
    tg.pnlp.planning: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN